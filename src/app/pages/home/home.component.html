<div class="home-container">

  <div class="home-header">
    @if (categoriaIds()?.length) {
      <h1 class="home-title">{{ tituloCategoria() || articles()[0]?.categoria_nombre || 'Categoría' }}</h1>
    } @else {
      <h1 class="home-title">Artículos</h1>
    }
    @if (!loading()) {
      <span class="home-count">{{ articles().length }} artículos</span>
    }
    <button class="btn btn-success btn-lg shadow-sm home-new-article-btn" (click)="addNewArticle()">
      <i class="bi bi-plus-lg me-2"></i> Nuevo Artículo
    </button>
  </div>

  <!-- ===================================== -->
  <!--   BLOQUE DE FILTROS (AÑADIDO AQUÍ)   -->
  <!-- ===================================== -->

  <!-- mog 200626 filtros v3 init-->
  <div class="home-filters d-flex flex-nowrap gap-2 overflow-auto pb-2 mb-4">

  <!-- Buscador -->
  <input
    type="text"
    class="form-control"
    style="width: 200px"
    placeholder="Buscar artículos..."
    [value]="filters().texto"
    (input)="onSearchTextChange($any($event.target).value)" />

  <!-- Categoría -->
  <select
    class="form-select"
    style="width: 180px"
    [value]="filters().categoria"
    (change)="onCategoryChange($any($event.target).value)">
    <option value="">Categoría</option>
    @for (cat of categories(); track cat.id) {
      <option [value]="cat.id">{{ cat.nombre }}</option>
    }
  </select>

  <!-- Estado -->
  <select
    class="form-select"
    style="width: 160px"
    [value]="filters().estado"
    (change)="onEstadoChange($any($event.target).value)">
    <option value="">Estado</option>
    <option value="Sin usar">Sin usar</option>
    <option value="En buen estado">En buen estado</option>
    <option value="Parcialmente dañado">Parcialmente dañado</option>
    <option value="Dañado">Dañado</option>
  </select>

  <!-- Precio mínimo -->
  <input
    type="number"
    class="form-control"
    style="width: 120px"
    placeholder="Mín."
    [value]="filters().min"
    (input)="onMinPriceChange($any($event.target).value)" />

  <!-- Precio máximo -->
  <input
    type="number"
    class="form-control"
    style="width: 120px"
    placeholder="Máx."
    [value]="filters().max"
    (input)="onMaxPriceChange($any($event.target).value)" />

  <!-- Ordenación -->
  <select
    class="form-select"
    style="width: 160px"
    [value]="filters().orden"
    (change)="onOrdenChange($any($event.target).value)">
    <option value="recientes">Más recientes</option>
    <option value="precio_asc">Precio ↑</option>
    <option value="precio_desc">Precio ↓</option>
  </select>

  <!-- Localización -->
  <input
    type="text"
    class="form-control"
    style="width: 160px"
    placeholder="Localización"
    [value]="filters().localizacion"
    (input)="onLocationChange($any($event.target).value)" />

  <!-- Reset -->
  <button
    class="btn btn-outline-secondary"
    (click)="resetFilters()">
    Limpiar
  </button>

</div>

  <!-- mog filtros v3 end-->

  <!-- ===================================== -->
  <!--   GRID DE PRODUCTOS (SIN TOCAR)       -->
  <!-- ===================================== -->

  <div class="products-grid">
    @for (article of results(); track article.id) {
      <app-product-card [article]="article" />
    }
  </div>

</div>

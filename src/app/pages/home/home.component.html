<div class="home-container">

  <!-- ===================================== -->
  <!--              CABECERA                 -->
  <!-- ===================================== -->
  <div class="home-header">

   <!--  @if (hasActiveFilters()) {
      <h1 class="home-title">Resultados filtrados</h1>
    }
    @else if (categoriaIds()?.length) {
      <h1 class="home-title">{{ tituloCategoria() }}</h1>
    }
    @else {
      <h1 class="home-title">Artículos</h1>
    } -->

    @if (categoriaIds()?.length) {
      <h1 class="home-title">{{ tituloCategoria() }}</h1>
    }
    @else if (hasActiveFilters()) {
      <h1 class="home-title">Resultados filtrados</h1>
    }
    @else {
      <h1 class="home-title">Artículos</h1>
    }


    @if (!loading()) {
      <span class="home-count">{{ results().length }} artículos</span>
    }

    <button class="btn btn-success btn-lg shadow-sm home-new-article-btn" (click)="addNewArticle()">
      <i class="bi bi-plus-lg me-2"></i> Nuevo Artículo
    </button>

  </div>


  <!-- ===================================== -->
  <!--                FILTROS                -->
  <!-- ===================================== -->
  <div class="home-filters d-flex flex-nowrap gap-3 overflow-auto pb-2 mb-4">

    <!-- Buscador -->
    <div class="d-flex flex-column">
      <label class="small text-muted mb-1">Buscar</label>
      <input
        type="text"
        class="form-control"
        style="width: 200px"
        placeholder="Buscar artículos..."
        [value]="filters().texto"
        (input)="onSearchTextChange($any($event.target).value)" />
    </div>

    <!-- Categoría -->
    <div class="d-flex flex-column">
      <label class="small text-muted mb-1">Categoría</label>
      <select
        class="form-select"
        style="width: 180px"
        [value]="filters().categoria"
        (change)="onCategoryChange($any($event.target).value)">
        <option value="">Todas</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.nombre }}</option>
        }
      </select>
    </div>

    <!-- Estado -->
    <div class="d-flex flex-column">
      <label class="small text-muted mb-1">Estado</label>
      <select
        class="form-select"
        style="width: 160px"
        [value]="filters().estado"
        (change)="onEstadoChange($any($event.target).value)">
        <option value="">Todos</option>
        <option value="Sin usar">Sin usar</option>
        <option value="En buen estado">En buen estado</option>
        <option value="Parcialmente dañado">Parcialmente dañado</option>
        <option value="Dañado">Dañado</option>
      </select>
    </div>

    <!-- Precio mínimo -->
    <div class="d-flex flex-column">
      <label class="small text-muted mb-1">Precio mín.</label>
      <input
        type="number"
        class="form-control"
        style="width: 120px"
        placeholder="Mín."
        [value]="filters().min"
        (input)="onMinPriceChange($any($event.target).value)" />
    </div>

    <!-- Precio máximo -->
    <div class="d-flex flex-column">
      <label class="small text-muted mb-1">Precio máx.</label>
      <input
        type="number"
        class="form-control"
        style="width: 120px"
        placeholder="Máx."
        [value]="filters().max"
        (input)="onMaxPriceChange($any($event.target).value)" />
    </div>

    <!-- Ordenación -->
    <div class="d-flex flex-column">
      <label class="small text-muted mb-1">Ordenar por</label>
      <select
        class="form-select"
        style="width: 160px"
        [value]="filters().orden"
        (change)="onOrdenChange($any($event.target).value)">
        <option value="recientes">Más recientes</option>
        <option value="precio_asc">Precio ↑</option>
        <option value="precio_desc">Precio ↓</option>
      </select>
    </div>

    <!-- Localización -->
    <div class="d-flex flex-column">
      <label class="small text-muted mb-1">Localización</label>
      <input
        type="text"
        class="form-control"
        style="width: 160px"
        placeholder="Localización"
        [value]="filters().localizacion"
        (input)="onLocationChange($any($event.target).value)" />
    </div>

    <!-- Reset -->
    <div class="d-flex flex-column justify-content-end">
      <button
        class="btn btn-outline-secondary"
        (click)="resetFilters()">
        Limpiar
      </button>
    </div>

  </div>


  <!-- ===================================== -->
  <!--           GRID DE PRODUCTOS           -->
  <!-- ===================================== -->
  <div class="products-grid">
    @for (article of results(); track article.id) {
      <app-article-card [article]="article" />
    }
  </div>

</div>

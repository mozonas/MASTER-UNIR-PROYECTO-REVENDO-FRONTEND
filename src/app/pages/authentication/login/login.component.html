<div class="login-wrapper">
  <div class="login-container">
    <div class="logo">
      <img src="images/logo_revendo.png" alt="logo">
    </div>

    <div class="login-form">
      <h2>INICIAR SESIÓN</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper" [class.invalid]="loginForm.get('email')?.invalid && submitted">
            <input id="email" type="email" formControlName="email" class="input-field" placeholder="correo@dominio.com" />
            <div class="field-error" *ngIf="loginForm.get('email')?.invalid && submitted">
              <span *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio.</span>
              <span *ngIf="loginForm.get('email')?.errors?.['email']">El formato de correo no es válido.</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper" [class.invalid]="loginForm.get('password')?.invalid && submitted">
            <input id="password" type="password" formControlName="password" class="input-field" placeholder="Ingresa tu contraseña" />
            <div class="field-error" *ngIf="loginForm.get('password')?.invalid && submitted">
              <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión</button>
      </form>
    </div>
  </div>
</div>

<div class="login-wrapper">
  <div class="login-container">
    <div class="logo">
      <img src="images/logo_revendo.png" alt="logo">
    </div>
    
    <div class="login-form">
      <h2>INICIAR SESIÓN</h2>
      
      <form>
        <div class="form-group">
          <input 
            type="email" 
            placeholder="Email" 
            class="input-field"
            required>
        </div>
        
        <div class="form-group">
          <input 
            type="password" 
            placeholder="Contraseña" 
            class="input-field"
            required>
        </div>
        
        <button type="submit" class="btn-login">LOGIN</button>
      </form>
    </div>
  </div>
</div>

<div class="login-wrapper">
  <div class="login-container">
    <div class="logo">
      <img src="images/logo_revendo.png" alt="logo">
    </div>

    <div class="login-form">
      <h2>INICIAR SESIÓN</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" formControlName="email" />

          <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">El formato de correo no es válido.</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" class="input-field" />

          <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid">Iniciar Sesión</button>
      </form>
    </div>
  </div>
</div>

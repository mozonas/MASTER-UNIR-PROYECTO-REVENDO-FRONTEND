<div class="welcome-container d-flex flex-column align-items-center justify-content-center overflow-hidden p-3">
    <div class="logo-wrapper mb-4 text-center">
        <img src="images/logo_revendo.png" alt="ReVendo" class="img-fluid logo-img" />
    </div>

    <div class="action-group d-flex flex-column flex-sm-row gap-3 w-100 justify-content-center">
        <button class="btn btn-custom btn-login px-5 py-3 fw-semibold" (click)="login()">
            Iniciar Sesión
        </button>

        <button class="btn btn-custom btn-signup px-5 py-3 fw-semibold" (click)="signin()">
            Registrarse
        </button>
    </div>
</div>

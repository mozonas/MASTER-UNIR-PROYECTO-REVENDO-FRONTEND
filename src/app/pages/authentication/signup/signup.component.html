<div class="signin-wrapper d-flex justify-content-center align-items-center vh-100">
  <div class="signin-card d-flex">

    <div class="logo-section d-flex flex-column justify-content-center align-items-center">
      <img src="images/logo_revendo.png" alt="reVendo logo" class="logo-img"/>
      <span class="brand-name">reVendo</span>
    </div>

    <div class="form-section">
      <h2 class="text-center mb-4">SIGNUP</h2>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

        <div class="mb-2">
          <label class="form-label">Nombre*</label>
          <input type="text" class="form-control form-control-sm"
                 name="nombre" [(ngModel)]="formData.nombre" required/>
        </div>

        <div class="mb-2">
          <label class="form-label">Apellidos*</label>
          <input type="text" class="form-control form-control-sm"
                 name="apellidos" [(ngModel)]="formData.apellidos" required/>
        </div>

        <div class="mb-2">
          <label class="form-label">Email*</label>
          <input type="email" class="form-control form-control-sm"
                 name="email" [(ngModel)]="formData.email" required/>
        </div>

        <div class="mb-2">
          <label class="form-label">Usuario*</label>
          <input type="text" class="form-control form-control-sm"
                 name="usuario" [(ngModel)]="formData.usuario" required/>
        </div>

        <div class="mb-2">
          <label class="form-label">Contraseña*</label>
          <input type="password" class="form-control form-control-sm"
                 name="password" [(ngModel)]="formData.password" required/>
        </div>

        <div class="mb-2">
          <label class="form-label">Foto</label>
          <input type="file" class="form-control form-control-sm"
                 (change)="onFileChange($event)" accept="image/*"/>
        </div>

        <div class="mb-2">
          <label class="form-label">Fecha de nacimiento*</label>
          <input type="date" class="form-control form-control-sm"
                name="fecha_nacimiento" [(ngModel)]="formData.fecha_nacimiento" required/>
        </div>

        <div class="mb-2">
          <label class="form-label">Dirección*</label>
          <input type="text" class="form-control form-control-sm"
                name="direccion" [(ngModel)]="formData.direccion" required/>
        </div>


        <div class="text-end mt-3">
          <button type="submit" class="btn btn-crear"
                  [disabled]="registerForm.invalid">
            Crear
          </button>
        </div>

      </form>
    </div>

  </div>
</div>

<div class="container-fluid mt-2 g-0">

  <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-light">
    <h1 class="h5 mb-0 text-dark-custom fw-semibold text-uppercase letter-spacing-05">
      Gestión de Incidencias de Mensajería
    </h1>
    <button type="button" class="btn-link-minimal d-inline-flex align-items-center" (click)="volverAlPanel()">
      <i class="bi bi-arrow-left me-1"></i> Volver al panel
    </button>
  </div>

  <div class="dashboard-section mb-4">
    <div class="section-title-bar">
      <h2 class="section-title">
        <span>💬</span> Incidencias de mensajería pendientes
      </h2>
    </div>
    <app-chats-pending-table [pendingData]="pendingChats()" (viewDetail)="goToDetail($event)">
    </app-chats-pending-table>
  </div>

  <div class="dashboard-section mb-5">
    <div class="section-title-bar">
      <h2 class="section-title">
        <span>📜</span> Historial de chats moderados
      </h2>
    </div>
    <app-chats-history-table [historyData]="chatsHistory()">
    </app-chats-history-table>
  </div>

</div>

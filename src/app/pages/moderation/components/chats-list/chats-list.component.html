<div class="container-fluid mt-2 g-0">

  <!-- Cabecera -->
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-dark border-opacity-10">
    <h1 class="h4 mb-0 text-secondary fw-normal">Gestión de Incidencias de Mensajería</h1>
    <button type="button" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center" (click)="volverAlPanel()">
      <i class="bi bi-arrow-left-short fs-5 me-1"></i> ◀ Volver
    </button>
  </div>

  <!-- Tarjeta 1: Mensajería Pendiente -->
  <div class="card shadow-sm border-0 rounded overflow-hidden mb-4 w-100 bg-white">
    <div class="card-header bg-white py-3 border-bottom">
      <h2 class="h6 mb-0 text-dark fw-bold text-uppercase">💬 Incidencias de mensajería pendientes</h2>
    </div>
    <app-chats-pending-table 
      [pendingData]="pendingChats()" 
      (viewDetail)="goToDetail($event)">
    </app-chats-pending-table>
  </div>

  <!-- Tarjeta 2: Historial de Mensajería -->
  <div class="card shadow-sm border-0 rounded overflow-hidden mb-5 w-100 bg-white">
    <div class="card-header bg-white py-3 border-bottom">
      <h2 class="h6 mb-0 text-dark fw-bold text-uppercase">📜 Historial de chats moderados</h2>
    </div>
    <app-chats-history-table 
      [historyData]="chatsHistory()">
    </app-chats-history-table>
  </div>

</div>


<div class="container mt-4 g-0">
  <div class="row g-4">

    <!-- Gestión de articulos -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded overflow-hidden animate-pulse">
        <div class="card-header py-3">
          <h2 class="h6 mb-0 text-white fw-bold text-uppercase">👗 Gestión de Artículos</h2>
        </div>
        <div class="card-body bg-white d-flex align-items-center justify-content-between p-4">
          <div>
            <p class="text-muted mb-1 small text-uppercase fw-bold font-badge">Alertas activas</p>
            <span [class.badge-incidencias]="pendingArticlesCount() > 0" [class.badge-limpio]="pendingArticlesCount() === 0" class="badge rounded-pill px-3 py-2 fw-bold fs-5">
              {{ pendingArticlesCount() }}
            </span>
          </div>
          <app-action-button [itemId]="1" (actionTriggered)="navigateToSection($event)"></app-action-button>
        </div>
      </div>
    </div>

    <!-- Gestión de mensajeria -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded overflow-hidden animate-pulse">
        <div class="card-header py-3">
          <h2 class="h6 mb-0 text-white fw-bold text-uppercase">💬 Gestión de Mensajería</h2>
        </div>
        <div class="card-body bg-white d-flex align-items-center justify-content-between p-4">
          <div>
            <p class="text-muted mb-1 small text-uppercase fw-bold font-badge">Alertas activas</p>
            <span [class.badge-incidencias]="pendingChatsCount() > 0" [class.badge-limpio]="pendingChatsCount() === 0" class="badge rounded-pill px-3 py-2 fw-bold fs-5">
              {{ pendingChatsCount() }}
            </span>
          </div>
          <app-action-button [itemId]="2" (actionTriggered)="navigateToSection($event)"></app-action-button>
        </div>
      </div>
    </div>

  </div>
</div>

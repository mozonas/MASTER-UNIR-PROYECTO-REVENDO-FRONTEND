<div class="container-fluid mt-2 g-0">

  <div class="d-flex justify-content-between align-items-center mb-4 pb-3">
    <h1 class="h5 mb-0 text-dark-custom fw-semibold text-uppercase letter-spacing-05">
      Gestión de Artículos
    </h1>
    <button type="button" class="btn-link-minimal d-inline-flex align-items-center" (click)="volverAlPanel()">
      <i class="bi bi-arrow-left me-1"></i> Volver al panel
    </button>
  </div>

  <div class="dashboard-section mb-4">
    <div class="section-title-bar">
      <h2 class="section-title">
        <span>👗</span> Artículos en revisión pendientes
      </h2>
    </div>
    <app-articles-pending-table [pendingData]="pendingArticles()" (viewDetail)="goToDetail($event)">
    </app-articles-pending-table>
  </div>

  <div class="dashboard-section mb-5">
    <div class="section-title-bar">
      <h2 class="section-title">
        <span>📜</span> Historial de artículos gestionados
      </h2>
    </div>
    <app-articles-history-table [historyData]="articlesHistory()">
    </app-articles-history-table>
  </div>

</div>

<ul class="user-list">

  <li class="header">
    <span>id</span>
    <span>nombre</span>
    <span>apellidos</span>
    <span>email</span>
    <span>usuario</span>
    <span>perfil</span>
    <span class="actions">Acciones</span>
  </li>

  @for (u of users; track u.id) {
    <li class="row">
      <span>{{ u.id }}</span>
      <span>{{ u.nombre }}</span>
      <span>{{ u.apellidos }}</span>
      <span>{{ u.email }}</span>
      <span>{{ u.usuario }}</span>
      <span>{{ u.perfil }}</span>

      <span class="actions">
        <button class="icon-btn edit" (click)="onEdit(u.id)">
          <img src="/images/ico-editar.svg" alt="Editar" />
        </button>

        <button class="icon-btn delete" (click)="onDelete(u.id)">
          <img src="/images/ico-eliminar.svg" alt="Eliminar" />
        </button>

        <button class="icon-btn block" (click)="onToggleBlock(u)">
          <img src="/images/ico-bloquear.svg" alt="Bloquear" />
        </button>
      </span>


    </li>
  }

</ul>

<div class="pagination">
  <button (click)="prevPage()" [disabled]="page === 1">Anterior</button>

  <span>Página {{ page }} de {{ totalPages }}</span>

  <button (click)="nextPage()" [disabled]="page === totalPages">Siguiente</button>
</div>

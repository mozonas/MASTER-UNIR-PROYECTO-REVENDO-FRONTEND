            <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img class="d-block w-100" src="./images/test-carrusel/g1.jpg" alt=""
                            (click)="openImageModal('./images/test-carrusel/g1.jpg')">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="./images/test-carrusel/g2.jpg" alt="Second slide"
                            (click)="openImageModal('./images/test-carrusel/g2.jpg')">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="./images/test-carrusel/g3.jpg" alt="Third slide"
                            (click)="openImageModal('./images/test-carrusel/g3.jpg')">
                    </div>
                </div>
                <a class="carousel-control-prev"  role="button" data-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </a>
                <a class="carousel-control-next"  role="button" data-slide="next">
                    <span class="carousel-control-next-icon"></span>

                </a>
            </div>

            <!-- Información -->
            <div class="row g-4 mt-2">

                <!-- Artículo -->
                <div class="col-lg-5">

                    <h3 class="fw-bold">
                        Guitarra acústica Yamaha
                    </h3>

                    <p class="text-muted">
                        Perfecta para empezar, cuerdas nuevas.
                    </p>

                    <p class="mb-1">
                        <strong>Estado:</strong> En buen estado
                    </p>

                    <p class="mb-1">
                        <strong>Tipo envío:</strong> En mano
                    </p>

                    <p>
                        <strong>Pago:</strong> Efectivo
                    </p>

                    <span class="badge categoria-badge">
                        Instrumentos
                    </span>

                </div>

                <!-- Precio -->
                <div class="col-lg-2 d-flex justify-content-center align-items-start">
                    <h1 class="fw-bold">
                        110€
                    </h1>
                </div>

                <!-- Vendedor -->
                <div class="col-lg-5">

                    <div class="card">

                        <div class="card-body">

                            <div class="d-flex justify-content-between mb-3">

                                <div>
                                    <small class="text-muted">
                                        Vendedor/a
                                    </small>

                                    <p class="mb-0">
                                        Marta Pérez
                                    </p>
                                </div>

                                <div>
                                    <small class="text-muted">
                                        Puntuación
                                    </small>

                                    <div class="text-warning">
                                        ★★★★☆
                                    </div>
                                </div>

                            </div>

                            <p>
                                20 artículos vendidos
                            </p>

                            <button class="btn btn-success w-100">
                                Mensaje directo
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
<!-- Modal -->
    <div class="modal fade" tabindex="-1" role="dialog" [ngClass]="{ show: modalOpen }"
        [ngStyle]="{ display: modalOpen ? 'block' : 'none' }">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark">

                <div class="modal-body text-center">
                    <img [src]="selectedImage" class="img-fluid" />
                </div>

                <div class="modal-footer">
                    <button class="btn btn-light" (click)="closeModal()">Cerrar</button>
                </div>

            </div>
        </div>
    </div>
</div>

<div class="product-card" [class.product-card--en-revision]="estaReportado" [class.product-card--vendido]="estaVendido" (click)="viewArticle(article)">
  <div class="product-card__image">
    <img [src]="'http://localhost:3000/' +article.imagen || 'images/placeholder-product.png'" [alt]="article.titulo" />
    @if (article.categoria_nombre) {
      <span class="product-card__badge">{{ article.categoria_nombre }}</span>
    }
    @if (estaReportado) {
      <span class="product-card__badge product-card__badge--revision">En revisión</span>
    }
    @if (estaVendido) {
      <div class="product-card__sold-overlay">
        <span class="product-card__sold-text">VENDIDO</span>
      </div>
    }
  </div>
  <div class="product-card__body">
    <h3 class="product-card__title">{{ article.titulo }}</h3>
    <p class="product-card__desc">{{ article.descripcion }}</p>
    <div class="product-card__footer">
      <span class="product-card__price">{{ article.precio | currency: 'EUR' : 'symbol' : '1.2-2' }}</span>
      <span class="product-card__location">{{ article.ubicacion }}</span>
    </div>
  </div>
  @if (showActions) {
    <div class="product-card__actions">
      <button
        class="product-card__action-btn product-card__action-btn--edit"
        (click)="editClicked.emit(article)"
        [disabled]="estaVendido"
      >
        <i class="fa fa-pencil me-1"></i> Editar
      </button>
      <button
        class="product-card__action-btn product-card__action-btn--delete"
        (click)="deleteClicked.emit(article)"
      >
        <i class="fa fa-trash me-1"></i> Eliminar
      </button>
    </div>
  }
</div>

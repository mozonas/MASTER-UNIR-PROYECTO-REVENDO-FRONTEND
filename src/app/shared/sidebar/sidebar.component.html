<nav class="custom-sidebar p-3 shadow-sm text-dark">
  <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-dark border-opacity-10">
    <i class="bi bi-shield-check me-2 fs-4 text-white"></i>
    <span class="h5 mb-0 fw-bold text-white">{{ title }}</span>
  </div>

  <div class="nav flex-column nav-pills">
    @for (option of options; track option.id) {
    <button type="button"
      class="nav-link mb-2 d-flex align-items-center border-0 w-100 text-start bg-transparent py-2.5 px-3 rounded transition-all"
      [class.active-custom]="option.id === activeTab" [class.text-dark-50]="option.id !== activeTab"
      (click)="onOptionClick(option.id)">
      <i class="bi {{ option.icon }} me-2 fs-5"></i>
      {{ option.name }}
    </button>
    }
  </div>
</nav>

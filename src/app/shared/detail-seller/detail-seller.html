<div class="pt-4 mt-auto text-center">
  <div class="row g-0 align-items-center justify-content-center">

    <div class="col-6 border-end pe-2 pe-sm-3">
      <div class="d-flex flex-column align-items-center justify-content-center h-100">

        <div class="d-flex align-items-center justify-content-center text-warning fs-5 fs-sm-3 text-nowrap mb-1">
          @for (estrella of estrellas; track $index) {
          <i class="fa" [ngClass]="estrella"></i>
          }
        </div>

        <div class="text-secondary small fw-medium lh-sm px-1">
          <span class="text-dark fw-bold fs-5 fs-sm-4">{{ ratingMedia }}</span><span class="text-muted">/5</span>
          <span class="d-block text-nowrap text-muted custom-mobile-text">
            ({{ totalValoraciones }} valoraciones)
          </span>
        </div>
      </div>
    </div>

    <div class="col-6 ps-2 ps-sm-3">
      <div class="d-flex flex-column align-items-center justify-content-center h-100">
        <div class="d-flex align-items-center justify-content-center text-success fs-5 fs-sm-3 mb-1">
          <i class="fa fa-shopping-bag" aria-hidden="true"></i>
        </div>
        <div class="text-secondary small fw-medium lh-sm px-1">
          <span class="text-dark fw-bold fs-5 fs-sm-4">{{ totalVendidos || 0 }}</span>
          <span class="d-block text-muted custom-mobile-text">Vendidos</span>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="chat-fab"
     [style.left.px]="posX"
     [style.top.px]="posY"
     (mousedown)="iniciarArrastre($event)"
     (click)="irAlChat()">
  @if (router.url === '/chat') {
    <span>←</span>
  } @else {
    <span>💬</span>
  }
  @if (mensajesNoLeidos > 0) {
    <span class="badge-fab">{{ mensajesNoLeidos }}</span>
  }
</div>
